 <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GODMADE — Admin Dashboard</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            min-height: 100vh;
            background: #08080d;
            color: #fff;
            font-family: Arial, sans-serif;
        }


        /* =========================================
           HEADER
        ========================================= */

        header {
            height: 75px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 35px;

            background: #11111a;

            border-bottom: 1px solid #292936;

            position: sticky;
            top: 0;

            z-index: 100;
        }


        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 2px;
        }


        .logo span {
            color: #a855f7;
        }


        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }


        .admin-email {
            color: #aaa;
            font-size: 14px;
        }


        .logout-btn {
            border: none;

            background: #252531;

            color: white;

            padding: 10px 18px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: 600;
        }


        .logout-btn:hover {
            background: #333342;
        }


        /* =========================================
           MAIN
        ========================================= */

        main {
            width: 92%;
            max-width: 1200px;

            margin: 40px auto;
        }


        .page-title {
            margin-bottom: 30px;
        }


        .page-title h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }


        .page-title p {
            color: #999;
        }


        /* =========================================
           DASHBOARD GRID
        ========================================= */

        .dashboard-grid {
            display: grid;

            grid-template-columns: 420px 1fr;

            gap: 30px;

            align-items: start;
        }


        /* =========================================
           CARDS
        ========================================= */

        .card {
            background: #14141d;

            border: 1px solid #292936;

            border-radius: 15px;

            padding: 25px;
        }


        .card h2 {
            font-size: 21px;

            margin-bottom: 25px;
        }


        /* =========================================
           FORM
        ========================================= */

        .form-group {
            margin-bottom: 18px;
        }


        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            color: #ddd;

            font-weight: 600;
        }


        input,
        textarea {

            width: 100%;

            background: #0d0d14;

            border: 1px solid #33333f;

            color: white;

            border-radius: 8px;

            padding: 13px;

            font-size: 15px;

            outline: none;
        }


        input:focus,
        textarea:focus {

            border-color: #8b5cf6;
        }


        textarea {

            min-height: 110px;

            resize: vertical;
        }


        /* =========================================
           IMAGE UPLOAD BOX
        ========================================= */

        .file-upload {

            position: relative;

            display: block;

            border: 2px dashed #3b3b49;

            border-radius: 10px;

            padding: 25px 15px;

            text-align: center;

            cursor: pointer;

            transition: 0.2s;

            min-height: 170px;

            overflow: hidden;
        }


        .file-upload:hover {

            border-color: #8b5cf6;

            background: #171720;
        }


        /*
           IMPORTANT:

           The file input is invisible,
           but it covers the entire upload box.

           This makes clicking anywhere inside
           the box open the Windows file picker.
        */

        .file-upload input[type="file"] {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            opacity: 0;

            cursor: pointer;

            z-index: 20;

            padding: 0;

            border: none;
        }


        .upload-icon {

            font-size: 35px;

            margin-bottom: 10px;

            pointer-events: none;
        }


        .file-text {

            color: #aaa;

            font-size: 14px;

            pointer-events: none;
        }


        .selected-file {

            margin-top: 10px;

            color: #a855f7;

            font-size: 14px;

            word-break: break-word;

            pointer-events: none;
        }


        /* =========================================
           IMAGE PREVIEW
        ========================================= */

        .image-preview {

            display: none;

            margin-top: 15px;

            border-radius: 10px;

            overflow: hidden;

            background: #09090e;

            border: 1px solid #292936;
        }


        .image-preview img {

            width: 100%;

            max-height: 280px;

            object-fit: contain;

            display: block;
        }


        /* =========================================
           UPLOAD BUTTON
        ========================================= */

        .upload-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: linear-gradient(
                90deg,
                #7c3aed,
                #ec4899
            );

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;
        }


        .upload-btn:hover {

            opacity: 0.9;
        }


        .upload-btn:disabled {

            opacity: 0.5;

            cursor: not-allowed;
        }


        /* =========================================
           PROGRESS
        ========================================= */

        .progress-container {

            display: none;

            margin-top: 18px;
        }


        .progress-text {

            display: flex;

            justify-content: space-between;

            color: #aaa;

            font-size: 13px;

            margin-bottom: 7px;
        }


        .progress-bar {

            width: 100%;

            height: 8px;

            background: #292936;

            border-radius: 10px;

            overflow: hidden;
        }


        .progress-fill {

            width: 0%;

            height: 100%;

            background: linear-gradient(
                90deg,
                #7c3aed,
                #ec4899
            );

            transition: width 0.2s;
        }


        /* =========================================
           MESSAGES
        ========================================= */

        .message {

            margin-top: 15px;

            padding: 12px;

            border-radius: 7px;

            display: none;

            font-size: 14px;

            line-height: 1.5;
        }


        .message.success {

            display: block;

            background: rgba(
                34,
                197,
                94,
                0.12
            );

            color: #4ade80;

            border: 1px solid rgba(
                34,
                197,
                94,
                0.3
            );
        }


        .message.error {

            display: block;

            background: rgba(
                239,
                68,
                68,
                0.12
            );

            color: #f87171;

            border: 1px solid rgba(
                239,
                68,
                68,
                0.3
            );
        }


        /* =========================================
           FRAMES LIST
        ========================================= */

        .frames-list {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;
        }


        .frame-item {

            background: #0d0d14;

            border: 1px solid #292936;

            border-radius: 12px;

            overflow: hidden;
        }


        .frame-item-image {

            width: 100%;

            height: 190px;

            background: #050509;
        }


        .frame-item-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;
        }


        .frame-item-info {

            padding: 15px;
        }


        .frame-item-info h3 {

            font-size: 17px;

            margin-bottom: 6px;
        }


        .frame-item-price {

            color: #a855f7;

            font-weight: 700;

            margin-bottom: 7px;
        }


        .frame-item-tagline {

            color: #ddd;

            font-size: 13px;

            margin-bottom: 8px;
        }


        .frame-item-description {

            color: #999;

            font-size: 13px;

            line-height: 1.5;

            margin-bottom: 15px;
        }


        /* =========================================
           DELETE
        ========================================= */

        .delete-btn {

            width: 100%;

            border: 1px solid #5c2525;

            background: #241313;

            color: #ff7777;

            padding: 9px;

            border-radius: 7px;

            cursor: pointer;
        }


        .delete-btn:hover {

            background: #351818;
        }


        /* =========================================
           EMPTY / LOADING
        ========================================= */

        .empty,
        .loading {

            color: #777;

            text-align: center;

            padding: 40px 10px;

            grid-column: 1 / -1;
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 900px) {

            .dashboard-grid {

                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 600px) {

            header {

                padding: 0 15px;
            }


            .admin-email {

                display: none;
            }


            main {

                width: 94%;

                margin: 25px auto;
            }


            .page-title h1 {

                font-size: 27px;
            }


            .card {

                padding: 18px;
            }


            .frames-list {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header>

        <div class="logo">

            GOD<span>MADE</span>

        </div>


        <div class="header-right">

            <div
                class="admin-email"
                id="adminEmail"
            >
                Checking login...
            </div>


            <button
                class="logout-btn"
                id="logoutBtn"
                type="button"
            >
                Logout
            </button>

        </div>

    </header>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main>


        <div class="page-title">

            <h1>
                Admin Dashboard
            </h1>

            <p>
                Manage your GODMADE frames and photography collection.
            </p>

        </div>


        <div class="dashboard-grid">


            <!-- =========================================
                 ADD FRAME
            ========================================== -->

            <section class="card">

                <h2>
                    Add New Frame
                </h2>


                <form id="frameForm">


                    <!-- FRAME NAME -->

                    <div class="form-group">

                        <label for="frameName">
                            Frame Name
                        </label>

                        <input
                            type="text"
                            id="frameName"
                            placeholder="e.g. The Last Light"
                            required
                        >

                    </div>


                    <!-- PRICE -->

                    <div class="form-group">

                        <label for="framePrice">
                            Price (₦)
                        </label>

                        <input
                            type="number"
                            id="framePrice"
                            placeholder="50000"
                            min="0"
                            required
                        >

                    </div>


                    <!-- SHORT DESCRIPTION -->

                    <div class="form-group">

                        <label for="frameTagline">
                            Short Description
                        </label>

                        <input
                            type="text"
                            id="frameTagline"
                            placeholder="A story of survival."
                            required
                        >

                    </div>


                    <!-- FULL DESCRIPTION -->

                    <div class="form-group">

                        <label for="frameDescription">
                            Full Description
                        </label>

                        <textarea
                            id="frameDescription"
                            placeholder="Tell the story behind this photograph..."
                            required
                        ></textarea>

                    </div>


                    <!-- =====================================
                         FRAME IMAGE
                    ====================================== -->

                    <div class="form-group">

                        <label for="frameImage">
                            Frame Image
                        </label>


                        <div
                            class="file-upload"
                            id="fileUploadBox"
                        >


                            <!-- REAL FILE INPUT -->

                            <input
                                type="file"
                                id="frameImage"
                                accept="image/jpeg,image/png,image/webp,image/jpg"
                                required
                            >


                            <div class="upload-icon">
                                📷
                            </div>


                            <div class="file-text">
                                Click to choose an image from your device
                            </div>


                            <div
                                class="selected-file"
                                id="selectedFile"
                            >
                                No image selected
                            </div>


                        </div>


                        <!-- IMAGE PREVIEW -->

                        <div
                            class="image-preview"
                            id="imagePreview"
                        >

                            <img
                                id="previewImage"
                                src=""
                                alt="Image Preview"
                            >

                        </div>

                    </div>


                    <!-- =====================================
                         UPLOAD BUTTON
                    ====================================== -->

                    <button
                        type="submit"
                        class="upload-btn"
                        id="uploadBtn"
                    >
                        Upload &amp; Add Frame
                    </button>


                    <!-- =====================================
                         PROGRESS
                    ====================================== -->

                    <div
                        class="progress-container"
                        id="progressContainer"
                    >

                        <div class="progress-text">

                            <span id="progressStatus">
                                Preparing...
                            </span>

                            <span id="progressPercent">
                                0%
                            </span>

                        </div>


                        <div class="progress-bar">

                            <div
                                class="progress-fill"
                                id="progressFill"
                            ></div>

                        </div>

                    </div>


                    <!-- =====================================
                         MESSAGE
                    ====================================== -->

                    <div
                        class="message"
                        id="message"
                    ></div>


                </form>

            </section>


            <!-- =========================================
                 EXISTING FRAMES
            ========================================== -->

            <section class="card">

                <h2>
                    Your Frames
                </h2>


                <div
                    class="frames-list"
                    id="framesList"
                >

                    <div class="loading">
                        Loading frames...
                    </div>

                </div>

            </section>


        </div>

    </main>


    <!-- =========================================
         ADMIN JAVASCRIPT
    ========================================== -->

    <script
        type="module"
        src="./admin.js"
    ></script>


</body>

</html>
